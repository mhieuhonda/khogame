name: CD

# ============================================================
# CD — Build Docker image, push GHCR, trigger Coolify deploy.
# Stack: Rust 1.98 (pin exact), axum 0.8.9, sqlx 0.9.
# Trigger: push main + tag v* (release) + manual workflow_dispatch.
# ============================================================

on:
  push:
    branches: [main]
    tags: ["v*"]
    # v3.6.0 FIX (Actions triệt để): thay đổi chỉ tài liệu (README/CHANGELOG/
    # docs/LICENSE) KHÔNG build image + deploy prod — trước đây 1 commit sửa
    # README vẫn đốt 25 phút CI gate + full Docker build + patch compose
    # Coolify, tạo đợt deploy tranh chấp không cần thiết (nguồn incident
    # 2026-08-30: 3 CD chạy đua). Lưu ý: paths-ignore áp cho mọi push event
    # (kể cả tag) — nhưng release tag thật LUÔN kèm bump Cargo.toml/Cargo.lock
    # nên không bao giờ bị skip; tag giả định chỉ đổi docs thì bỏ deploy cũng
    # đúng (image không đổi). Muốn deploy thủ công bất kể path:
    # workflow_dispatch.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  CARGO_TERM_COLOR: always

# v3.5.1 FIX (audit 5-c — least privilege): workflow-level chỉ đọc; job
# build-push tự nới packages:write. ci-gate + deploy-coolify trước đây
# thừa kế packages:write dù không đẩy image nào — thu hẹp blast radius
# nếu runner/action bị xâm nhập.
permissions:
  contents: read

# KHÔNG cancel deploy đang chạy — có thể deploy partial state, hỏng prod.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: CI gate — block deploy nếu code không pass CI.
  # Trùng logic với .github/workflows/ci.yml nhưng chạy ở đây để
  # deploy.yml có thể chạy độc lập (vd khi trigger bằng workflow_dispatch
  # hoặc push tag mà CI workflow không trigger).
  #
  # ⚠️ KHÔNG chạy `cargo fmt --check` ở đây — CI workflow (.github/workflows/ci.yml)
  # đã có job autofmt tự format + commit ngược về branch với [skip ci]. Nếu để
  # fmt check trong CD ci-gate, sẽ block deploy khi 1 commit lớn quên fmt
  # (chính là root cause của v1.1.0 deploy fail). CI tự fix fmt tách biệt
  # khỏi CD — deploy không bao giờ bị chặn vì lý do formatting.
  # ────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate (Rust 1.98)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pin SHA (supply-chain)

      - name: Verify tag version khớp Cargo.toml (chống image serve sai version)
        # Incident v3.4.2: tag v3.4.2 push nhưng Cargo.toml vẫn 3.4.1 →
        # image build ra serve "3.4.1" qua /health → CD verify của main/v3.5.0
        # fail oan + release v3.4.2 fail. Gate này chặn sớm ngay từ ci-gate.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          CARGO_VERSION=$(grep -E '^version = "[0-9]' Cargo.toml | head -1 | sed -E 's/.*"([0-9][^"]*)".*/\1/')
          echo "Tag version: $VERSION | Cargo.toml: $CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $TAG lệch version với Cargo.toml ($CARGO_VERSION). Bump version rồi tag lại."
            exit 1
          fi
          echo "✅ Tag version khớp Cargo.toml ($CARGO_VERSION)."

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 — pin SHA (supply-chain)
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Auto-format code (best-effort — không block deploy)
        # Tự chạy cargo fmt trước check để fmt violation không làm fail
        # downstream steps (clippy có thể báo warning nếu code chưa format
        # trong 1 số edge case). Diff không được commit — chỉ local fix.
        run: cargo fmt --all || true

      - name: Cargo check (--locked)
        run: cargo check --locked --all-targets

      - name: Clippy (-D warnings)
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Cargo test --locked
        run: cargo test --locked --all

      - name: Rustdoc (-D warnings)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ────────────────────────────────────────────────────────────
  # Job 2: Build & push Docker image to GHCR.
  # Pin digest (sha256:...) vào output để deploy job có thể pin
  # image theo digest (immutable) thay vì tag (mutable, có thể bị
  # override sau khi Coolify pull).
  # ────────────────────────────────────────────────────────────
  build-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    needs: ci-gate
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image_ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pin SHA (supply-chain)

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4 — pin SHA (supply-chain)
        with:
          # BuildKit mặc định — cần cho --mount=type=cache trong Dockerfile.
          # v3.5.1 FIX (audit 5-c): pin version thay vì :latest — image daemon
          # build prod image không nên trôi theo tag mutable (supply chain).
          driver-opts: |
            image=moby/buildkit:v0.32.2

      - name: Đăng nhập GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4 — pin SHA (supply-chain)
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chuẩn bị tag image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6 — pin SHA (supply-chain)
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=khogame
            org.opencontainers.image.description=Louis Space — Vietnamese indie game & news platform
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.source=https://github.com/mhieuhonda/khogame

      - name: "Build & push (BuildKit cache: gha)"
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7 — pin SHA (supply-chain)
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          # Sbom: false — giảm image manifest size, Coolify không dùng sbom.
          sbom: false

      - name: Tóm tắt image
        if: always()
        run: |
          echo "## Docker Image Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image**: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ────────────────────────────────────────────────────────────
  # Job 3: Trigger Coolify deploy.
  # ⚠️ KHÔNG dùng continue-on-error — deploy failure phải HIỂN THỊ
  # (workflow đỏ) để operator biết web chưa update. Trước đây có
  # continue-on-error=true khiến workflow báo success dù deploy fail
  # (token expired) → user thấy "build xong" nhưng web không đổi.
  # Build image vẫn ở GHCR sẵn sàng cho manual deploy nếu cần retry.
  #
  # 🔒 SERIALIZED DEPLOY: concurrency level-job với group CỐ ĐỊNH
  # (không chứa github.ref) → các deploy từ main + tag KHÔNG BAO GIỜ
  # chạy đè nhau. Incident 2026-08-30 (v3.4.2/v3.5.0/main push cùng lúc):
  # 3 CD PATCH compose Coolify đồng thời → deploy cuối cùng thắng là
  # image CŨ (v3.4.2 serve 3.4.1) → verify của main/v3.5.0 fail + prod
  # chạy bản cũ. Tương tự incident v2.9.1 (stack kẹt starting:unknown,
  # web 503 25 phút). Group cố định = 1 deploy tại 1 thời điểm, FIFO.
  # ────────────────────────────────────────────────────────────
  deploy-coolify:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 20
    concurrency:
      group: coolify-deploy
      cancel-in-progress: false
    env:
      COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
      IMAGE_REF: ${{ needs.build-push.outputs.image_ref }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://louis.vangioitutien.com' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5 — pin SHA (supply-chain)
        with:
          # Cần full tags để so sánh tag hiện tại với tag mới nhất (stale guard)
          fetch-depth: 0

      - name: Guard — skip deploy cho tag cũ (chống rollback prod)
        # Nếu push tag CŨ (vd re-push v3.4.2 khi đã có v3.5.0) → KHÔNG deploy
        # để không rollback prod về bản cũ. Image vẫn build + release vẫn tạo.
        id: stale-guard
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          CURRENT="${GITHUB_REF_NAME#v}"
          # Tag mới nhất theo semver (sort -V)
          LATEST=$(git tag -l 'v*' | sed -E 's/^v//' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "Tag hiện tại: v$CURRENT | Tag mới nhất: v$LATEST"
          if [ "$CURRENT" != "$LATEST" ]; then
            echo "skip=yes" >> "$GITHUB_OUTPUT"
            echo "::notice::Tag v$CURRENT không phải mới nhất (v$LATEST) — SKIP deploy để không rollback prod. Image vẫn ở GHCR, GitHub Release vẫn tạo bình thường."
          else
            echo "skip=no" >> "$GITHUB_OUTPUT"
            echo "✅ Tag v$CURRENT là mới nhất — deploy bình thường."
          fi

      - name: Verify required secrets
        id: verify-secrets
        if: steps.stale-guard.outputs.skip != 'yes'
        continue-on-error: true
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_API_TOKEN" ] || [ -z "$COOLIFY_SERVICE_UUID" ]; then
            echo "::warning::Missing Coolify secrets (COOLIFY_URL, COOLIFY_API_TOKEN, COOLIFY_SERVICE_UUID). Skipping deploy. Configure in repo Settings → Secrets and Variables → Actions."
            exit 1
          fi
          echo "All Coolify secrets present."

      - name: Skip if secrets missing
        if: steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'failure'
        run: |
          echo "::notice::Skipping Coolify deploy — secrets missing. Image is at GHCR ready for manual deploy."

      - name: Pin image digest vào compose prod
        if: steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'success'
        run: |
          sed -i "s|__IMAGE_REF__|${{ env.IMAGE_REF }}|g" deploy/compose.prod.yml
          echo "── compose.prod.yml (image line) ──"
          grep -n "image:" deploy/compose.prod.yml | head -5

      - name: PATCH compose lên Coolify
        if: steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'success'
        id: patch
        run: |
          set -uo pipefail
          python3 - <<'PY'
          import json, os, base64, urllib.request, urllib.error, time, sys
          compose = open("deploy/compose.prod.yml").read()
          body = json.dumps({
              "docker_compose_raw": base64.b64encode(compose.encode()).decode()
          }).encode()
          url = f"{os.environ['COOLIFY_URL']}/api/v1/services/{os.environ['COOLIFY_SERVICE_UUID']}"
          headers = {
              "Authorization": f"Bearer {os.environ['COOLIFY_API_TOKEN']}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }
          # Retry 3 lần với backoff 5s/15s/30s — Coolify đôi khi 503 transient.
          for attempt in range(1, 4):
              try:
                  req = urllib.request.Request(url, data=body, method="PATCH", headers=headers)
                  with urllib.request.urlopen(req, timeout=30) as r:
                      print(f"PATCH compose OK (HTTP {r.status})")
                      sys.exit(0)
              except urllib.error.HTTPError as e:
                  body_text = e.read().decode(errors="replace")[:500]
                  print(f"Attempt {attempt}/3 — HTTP {e.code}: {body_text}", file=sys.stderr)
                  if e.code in (401, 403):
                      print("::error::Coolify API token invalid/expired. Generate new token at Profile → API Tokens, then update repo secret COOLIFY_API_TOKEN.", file=sys.stderr)
                      sys.exit(1)  # Don't retry auth errors
              except Exception as e:
                  print(f"Attempt {attempt}/3 — Exception: {e}", file=sys.stderr)
              if attempt < 3:
                  time.sleep(5 * attempt * 2)
          # ⚠️ FAIL thay vì continue — nếu PATCH không xong, compose trên
          # Coolify vẫn giữ image cũ → trigger deploy sẽ redeploy OLD image
          # (lừa dối operator tưởng đã update). Thay vào đó fail để trigger
          # step bị skip, operator fix Coolify rồi re-run workflow.
          print("::error::Coolify PATCH failed after 3 retries — compose NOT updated. Fix Coolify then re-run this workflow. Image is at GHCR ready.", file=sys.stderr)
          sys.exit(1)
          PY

      - name: Trigger deploy (POST /api/v1/deploy)
        # always() để step được evaluate dù PATCH fail; condition bên trong
        # quyết định chạy hay không. Nếu PATCH fail → skip trigger (compose
        # chưa update → trigger chỉ redeploy OLD image, lừa dối operator).
        if: always() && steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'success' && steps.patch.outcome == 'success'
        id: trigger
        run: |
          set -uo pipefail
          RESP=$(curl -sS -X POST \
            "${COOLIFY_URL}/api/v1/deploy?uuid=${COOLIFY_SERVICE_UUID}&force=true" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --max-time 30 || echo '{"error":"curl failed"}')
          echo "$RESP"
          QUEUED=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("yes" if d.get("deployments") else "no")' 2>/dev/null || echo "no")
          echo "queued=$QUEUED" >> "$GITHUB_OUTPUT"
          if [ "$QUEUED" != "yes" ]; then
            echo "::error::Coolify deploy NOT queued — check Coolify dashboard. Response: $RESP"
            exit 1
          fi

      - name: Chờ stack healthy (tối đa 10 phút)
        if: always() && steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'success' && steps.patch.outcome == 'success' && steps.trigger.outputs.queued == 'yes'
        run: |
          set -uo pipefail
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(curl -sS "${COOLIFY_URL}/api/v1/services/${COOLIFY_SERVICE_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              --max-time 10 \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))' 2>/dev/null || echo "?")
            echo "[$i/20] service status: $STATUS"
            case "$STATUS" in
              running:healthy)
                echo "::notice::Deploy thành công — Coolify reports running:healthy"
                exit 0
                ;;
              failed|cancelled|error|degraded:unhealthy)
                echo "::error::Coolify stack ở trạng thái $STATUS — web có thể đang down. Check Coolify dashboard + container logs ngay."
                exit 1
                ;;
            esac
          done
          echo "::error::Hết 10 phút chờ — Coolify chưa healthy. Check dashboard manually."
          exit 1

      - name: Verify deployed image matches built image
        if: always() && steps.stale-guard.outputs.skip != 'yes' && steps.verify-secrets.outcome == 'success' && steps.patch.outcome == 'success'
        id: verify
        continue-on-error: false
        run: |
          set -uo pipefail
          # Verify deploy thành công bằng cách check web /health version
          # match với version trong Cargo.toml. Robust với race condition
          # khi main + tag CD chạy đồng thời (2 image cùng version, digest
          # khác nhau → exact digest check false-fail). Check version là
          # signal đúng: nếu web trả expected version → deploy OK.
          #
          # v3.6.2 FIX (CD fail 2026-08-30 18:25 — "Verify deployed image"
          # step đỏ): trước đây vòng chờ chỉ 12 × 15s = 3 PHÚT, trong khi
          # (1) job deploy được serialize qua concurrency group coolify-deploy
          # (main + tag chạy đua → run này phải đợi run kia PATCH + trigger
          # xong), (2) Coolify pull image ~250MB + container start ~60-90s.
          # 3 phút thường không đủ → verify fail OAN dù deploy OK. Giờ chờ
          # 40 × 15s = 10 PHÚT — bằng đúng thời gian "Chờ stack healthy",
          # và tính thời gian bắt đầu từ SAU khi trigger (không tính build).
          EXPECTED_VERSION=$(grep -E '^version = "[0-9]' Cargo.toml | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          EXPECTED_IMAGE="${{ env.IMAGE_REF }}"
          echo "Expected version: $EXPECTED_VERSION"
          echo "Expected image:    $EXPECTED_IMAGE"
          if [ -z "$EXPECTED_VERSION" ]; then
            echo "::error::Cannot read version from Cargo.toml"; exit 1
          fi
          for i in $(seq 1 40); do
            sleep 15
            # 1) Check web /health (primary signal) — dùng PUBLIC_URL (repo
            # variable, fallback domain prod) thay vì hardcode.
            WEB=$(curl -sS --max-time 10 "${PUBLIC_URL}/health" 2>/dev/null || echo "FAIL")
            echo "[$i/40] Web /health: $WEB"
            WEB_VERSION=$(echo "$WEB" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("version",""))' 2>/dev/null || echo "")
            WEB_STATUS=$(echo "$WEB" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("status",""))' 2>/dev/null || echo "")
            if [ "$WEB_STATUS" = "ok" ] && [ "$WEB_VERSION" = "$EXPECTED_VERSION" ]; then
              echo "::notice::Web serving version $EXPECTED_VERSION (status ok) → deploy thành công."
              # 2) Check Coolify compose digest (informational — có thể mismatch do race)
              curl -sS "${COOLIFY_URL}/api/v1/services/${COOLIFY_SERVICE_UUID}" \
                -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
                --max-time 10 -o /tmp/coolify_svc.json 2>/dev/null || true
              RUNNING=$(python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open("/tmp/coolify_svc.json"))
              c = d.get("docker_compose_raw", "").split("khogame-db")[0]
              for line in c.splitlines():
                  if "image:" in line and "khogame@" in line:
                      print(line.split("image:", 1)[1].strip().strip("'\"").strip())
                      break
          except Exception:
              print("")
          PYEOF
          )
              echo "Coolify compose image: $RUNNING"
              if [ "$RUNNING" = "$EXPECTED_IMAGE" ]; then
                echo "::notice::Coolify compose digest match exact build."
              else
                echo "::notice::Coolify compose digest khác build (race condition khi main+tag deploy đồng thời — OK vì cùng version $EXPECTED_VERSION)."
              fi
              exit 0
            fi
          done
          echo "::error::Web chưa serve version $EXPECTED_VERSION sau 10 phút. Last /health: $WEB"
          exit 1

      - name: Deploy summary
        if: always()
        run: |
          echo "## Coolify Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Image built**: \`${{ env.IMAGE_REF }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Stale-tag guard (skip deploy)**: ${{ steps.stale-guard.outputs.skip || 'no' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Secrets verified**: ${{ steps.verify-secrets.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Compose PATCHed**: ${{ steps.patch.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deploy triggered**: ${{ steps.trigger.outcome }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deploy thành công — web đã update image mới." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Deploy FAILED — web có thể vẫn chạy image cũ. Image đã ở GHCR sẵn sàng manual deploy từ Coolify dashboard." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Troubleshooting:**" >> $GITHUB_STEP_SUMMARY
            echo "- PATCH 401/403: Coolify API token hết hạn → generate token mới, update repo secret \`COOLIFY_API_TOKEN\`" >> $GITHUB_STEP_SUMMARY
            echo "- Stack unhealthy: check container logs trên Coolify dashboard (DB crash-loop thường do compose hardening quástrict)" >> $GITHUB_STEP_SUMMARY
