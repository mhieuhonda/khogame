name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Kiểm tra (Rust 1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cài Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (--locked)
        run: cargo check --locked

      - name: Cargo test
        run: cargo test --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Rustfmt
        run: cargo fmt --all -- --check

  audit:
    name: Bảo mật dependency (cargo-audit)
    runs-on: ubuntu-latest
    # Chạy song song với job check — không chặn nếu DB test cần lâu
    steps:
      - uses: actions/checkout@v7

      - name: Cài cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit RustSec advisories (Cargo.lock)
        run: cargo audit --deny warnings
        continue-on-error: false
