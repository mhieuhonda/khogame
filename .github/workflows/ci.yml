name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Kiểm tra PR (Rust 1.98)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Cargo check (--locked)
        run: cargo check --locked

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings || echo "::warning::Clippy có cảnh báo"

      - name: Rustfmt
        run: cargo fmt --all -- --check || echo "::warning::Code chưa format"
