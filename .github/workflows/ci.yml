name: CI

# ============================================================
# CI — Continuous Integration cho khogame (Louis Space)
# Chạy trên mọi push main + PR main. Skip cho doc-only changes.
# Stack: Rust 1.98 (pin exact), axum 0.8.9, sqlx 0.9, askama 0.16.
#
# TRIẾT LÝ: "fmt không bao giờ chặn deploy". Khi 1 commit lớn (vd live
# chat) quên chạy `cargo fmt`, CI sẽ:
#   1) Auto-format code qua `cargo fmt --all`.
#   2) Commit diff ngược về branch với GITHUB_TOKEN + [skip ci].
#   3) Tiếp tục chạy check/clippy/test/doc bình thường.
# Trước đây (v1.1.0) fmt fail → chặn toàn bộ CD → prod không update
# được tới 12 giờ vì dev quên `cargo fmt` trước push.
# ============================================================

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
      - ".github/dependabot.yml"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

# Cancel superseded runs on same ref — tiết kiệm runner minutes.
# KHÔNG cancel job đang chạy deploy (xem deploy.yml có concurrency riêng).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# v3.5.1 FIX (supply-chain, audit 5-c): default permissions mức workflow =
# contents: read — job autofmt tự nới lên contents:write khi cần commit fmt.
# Trước đây các job khác thừa kế quyền mặc định của repo (có thể là
# read/write trên repo cũ) → nếu action bên thứ 3 bị xâm nhập, token lộ
# có ghi được vào repo.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  # Force cargo refresh registry — tránh cache stale khi Dependabot bump version.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  # Job 0: Auto-format + commit back. Chạy trước mọi job khác để fmt
  # không bao giờ chặn CI/CD. PR thì auto-push không khả thi (không có
  # quyền push về fork) → job skip phần commit, chỉ check.
  autofmt:
    name: Auto-format (rustfmt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Cần token có write permission để commit ngược về branch.
          # GITHUB_TOKEN mặc định đã có contents:write khi trigger push main.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"
          components: rustfmt

      - name: Cargo fmt --all (auto-fix)
        run: cargo fmt --all

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=no" >> "$GITHUB_OUTPUT"
            echo "✅ Code đã format đúng — không cần commit lại."
          else
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "⚠️ Phát hiện code chưa format — sẽ commit diff ngược về branch."
            git diff --stat
          fi

      - name: Commit formatted code back to branch
        # Chỉ commit khi:
        # 1) Có thay đổi fmt
        # 2) Đang trên push main (không phải PR — PR từ fork không có quyền push)
        # 3) Không phải tag push (không commit ngược về tag)
        if: steps.changes.outputs.changed == 'yes' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style(ci): auto-format với cargo fmt [skip ci]

          Được tạo tự động bởi CI workflow (.github/workflows/ci.yml job autofmt)
          vì commit trước đó chưa chạy \`cargo fmt --all\`."
          # Retry 3 lần — nếu có push khác vào main giữa chừng thì rebase rồi push lại.
          for attempt in 1 2 3; do
            if git push; then
              echo "✅ Đã commit diff fmt ngược về main với [skip ci]."
              exit 0
            fi
            echo "⚠️ Push thất bại (lần $attempt/3) — pull --rebase rồi thử lại."
            git pull --rebase origin main || { echo "::error::Rebase conflict — job autofmt cần chạy lại."; exit 1; }
          done
          echo "::error::Không push được sau 3 lần thử."
          exit 1

      - name: Verify fmt clean (PR mode — fail để contributor tự fix)
        # PR không push được về fork, chỉ warn contributor qua failure rõ ràng.
        if: steps.changes.outputs.changed == 'yes' && github.event_name == 'pull_request'
        run: |
          echo "::error::Code chưa được format. Chạy 'cargo fmt --all' locally rồi push lại."
          git diff
          exit 1

  # Job 1: cargo check — build dependency graph + verify Cargo.lock consistent.
  # Chạy nhanh nhất (~30s với cache), là early gate cho các job sau.
  #
  # ⚠️ CHECKOUT THEO REF (không phải github.sha): nếu job autofmt vừa push
  # commit fmt lên main thì github.sha là commit CŨ (chưa fmt) → các job
  # này kiểm tra code lỗi thời, job fmt/verify sẽ fail oan. Checkout theo
  # github.ref (refs/heads/main) luôn lấy head mới nhất sau autofmt.
  check:
    name: Cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo check (--locked — fail nếu Cargo.lock không khớp Cargo.toml)
        run: cargo check --locked --all-targets

  # Job 2: rustfmt — check formatting. Đã được autofmt xử lý trước đó,
  # nên job này gần như luôn pass. Giữ lại để có log rõ ràng khi contributor
  # push code chưa format từ fork (không có quyền push ngược).
  fmt:
    name: Rustfmt (verify)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          # Lấy head mới nhất (kể cả commit fmt autofmt vừa push) — nếu
          # checkout github.sha (commit cũ chưa fmt) thì verify LUÔN fail oan.
          ref: ${{ github.ref }}

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"
          components: rustfmt

      - name: Cargo fmt --check
        run: cargo fmt --all -- --check

  # Job 3: clippy — lint với -D warnings (warning = error).
  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy --all-targets
        run: cargo clippy --all-targets --locked -- -D warnings

  # Job 4: cargo test — chạy 159+ unit test.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo test --locked
        run: cargo test --locked --all

  # Job 5: rustdoc — kiểm tra broken intra-doc link + Rust code block trong /// comments.
  doc:
    name: Rustdoc (no-deps, -D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Cài Rust 1.98 (exact pin)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.98 pin SHA — supply-chain hardening (audit 5-c)
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cargo doc
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # Job 6: cargo-audit — quét RustSec advisories cho Cargo.lock.
  # Chạy song song với các job khác — không chặn nếu cargo test lâu.
  audit:
    name: Cargo audit (RustSec)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    needs: autofmt
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      - name: Cài cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit advisories
        run: cargo audit --deny warnings
