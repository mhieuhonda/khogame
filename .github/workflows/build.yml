name: Build & Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Kiểm tra (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust 1.98
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check || echo "::warning::Code chưa format"

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings || echo "::warning::Clippy có cảnh báo"

      - name: Cargo check
        run: cargo check --locked

  build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Đăng nhập GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Chuẩn bị metadata image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build & Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Trigger Coolify Deploy (POST webhook)
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Gọi Coolify webhook
        # Coolify 4.3.7: webhook deploy bắt buộc POST (GET sẽ trả 405)
        run: |
          echo "Trigger deploy Coolify cho image mới: ${{ needs.build-push.outputs.digest || 'latest' }}"
          if [ -n "${{ secrets.COOLIFY_WEBHOOK_URL }}" ]; then
            echo "→ POST ${{ secrets.COOLIFY_WEBHOOK_URL }}"
            curl -fsS -X POST "${{ secrets.COOLIFY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "::warning::Webhook Coolify trả lỗi"
          elif [ -n "${{ secrets.COOLIFY_API_TOKEN }}" ] && [ -n "${{ secrets.COOLIFY_APP_UUID }}" ]; then
            echo "→ POST ${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}"
            curl -fsS -X POST "${{ secrets.COOLIFY_URL }}/api/v1/deploy?uuid=${{ secrets.COOLIFY_APP_UUID }}" \
              -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
              -H "Content-Type: application/json" \
              --max-time 30 || echo "::warning::Deploy API Coolify trả lỗi"
          else
            echo "::warning::Chưa cấu hình COOLIFY_WEBHOOK_URL hoặc (COOLIFY_URL + COOLIFY_API_TOKEN + COOLIFY_APP_UUID) — bỏ qua deploy"
          fi
