[package]
name = "khogame"
version = "1.2.0"
edition = "2021"
rust-version = "1.98"
authors = ["Louis Space Team"]
description = "Louis Space — nền tảng chia sẻ game & tin tức độc lập Việt Nam"
license = "MIT"
repository = "https://github.com/mhieuhonda/khogame"
homepage = "https://louis.vangioitutien.com"
readme = "README.md"
keywords = ["web", "axum", "htmx", "games", "news", "vietnam"]
categories = ["web-programming::http-server"]

[[bin]]
name = "khogame"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "form", "ws", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip", "set-header", "request-id"] }

# Templating
askama = "0.16.0"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Authentication (Google OAuth 2.0 qua reqwest)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
slug = "0.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Dev/test build nhanh hơn ~40%: dependencies (sqlx, tokio, axum...) compile
# opt-level 1 — chỉ crate chính giữ debug không tối ưu. sqlx query macros
# sinh nhiều code, opt deps giảm đáng kể thời gian `cargo test` mỗi lần.
# debug = 1: line tables only (rẻ, đủ cho backtrace có line info khi panic
# trong test). Trước đây `debug = 0` loại bỏ hoàn toàn debug info →
# backtrace panic chỉ có function name, không có line number.
[profile.dev.package."*"]
opt-level = 1
debug = 1
