[package]
name = "khogame"
version = "3.8.0"
edition = "2021"
rust-version = "1.98"
authors = ["Louis Space Team"]
description = "Louis Space — nền tảng chia sẻ game & tin tức độc lập Việt Nam"
license = "MIT"
repository = "https://github.com/mhieuhonda/khogame"
homepage = "https://louis.vangioitutien.com"
readme = "README.md"
keywords = ["web", "axum", "htmx", "games", "news", "vietnam"]
categories = ["web-programming::http-server"]

[[bin]]
name = "khogame"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "form", "ws", "multipart"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
# v3.6.2 — catch-panic: panic trong handler (lỗi code bất ngờ) thành 500
# response sạch thay vì connection reset (user thấy ERR_EMPTY_RESPONSE /
# "không kết nối được server" — khó debug hơn 500 rất nhiều).
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip", "compression-br", "compression-zstd", "set-header", "request-id", "catch-panic"] }

# Templating
askama = "0.16.0"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Authentication (Google OAuth 2.0 qua reqwest)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.10"
sha2 = "0.11"
hex = "0.4"
# v3.5.1 — HMAC-SHA256 ký anon cookie (rate-limit identity) chống bot xoay
# cookie tạo bucket mới. Đã là dependency bậc trong của argon2 (RustCrypto,
# well-audited) — thêm trực tiếp để dùng API chuẩn.
hmac = "0.13"
# v3.4.0 — AI Agent password login: admin tạo username + password (có thời
# hạn). Argon2id là chuẩn OWASP cho password hashing (memory-hard, chống
# GPU/ASIC brute-force). Pure Rust + rustcrypto, không kéo OpenSSL.
argon2 = "0.5"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
slug = "0.1"
# v2.7.0 — parse/validate URL mạng xã hội trên hồ sơ (allowlist hostname
# từng nền tảng). Đã là dependency bậc trong của reqwest, thêm trực tiếp
# để app dùng được API chuẩn (Url::parse + host_str).
url = "2"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

# v2.2.0 — Markdown engine: comrak (GFM superset) + syntect (syntax highlighting)
# Comrak hỗ trợ 100% CommonMark + GitHub Flavored Markdown (tables, tasklists,
# strikethrough, autolinks, footnotes, math) + tagfilter + raw HTML disable.
# Syntect dùng Sublime syntax + theme để highlight code blocks.
# v2.3.0 — unicode-normalization cho slug heading anchor (Việtnamese →
# ASCII slug): NFD decomposition + strip mark → "Tiêu đề" thành "tieu-de".
comrak = { version = "0.54", default-features = false, features = ["shortcodes"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
unicode-normalization = "0.1"
once_cell = "1"

# v2.2.0 — Email notifications: lettre (SMTP) + lettre_message?
# Chỉ compile khi feature `email` được bật để tránh nặng build cho dev local.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls", "tokio1-rustls-tls"], optional = true }
mime = { version = "0.3", optional = true }

[features]
default = ["email"]
# Bật email transport (lettre + SMTP). Tắt để build không cần openssl/lettre.
email = ["dep:lettre", "dep:mime"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# v2.6.0 — panic = "unwind" thay vì "abort": một panic ở bất kỳ task nào
# (vd: render markdown nặng, unwrap thiếu, race condition) sẽ chỉ kill task
# đó, không kéo theo cả process. Trước đây "abort" khiến 1 panic = toàn bộ
# server chết, browser nhận connection reset → user thấy "hang forever".
# unwind có overhead nhỏ (~1-2% binary size) nhưng đáng để đảm bảo uptime.
panic = "unwind"

# Dev/test build nhanh hơn ~40%: dependencies (sqlx, tokio, axum...) compile
# opt-level 1 — chỉ crate chính giữ debug không tối ưu. sqlx query macros
# sinh nhiều code, opt deps giảm đáng kể thời gian `cargo test` mỗi lần.
# debug = 1: line tables only (rẻ, đủ cho backtrace có line info khi panic
# trong test). Trước đây `debug = 0` loại bỏ hoàn toàn debug info →
# backtrace panic chỉ có function name, không có line number.
[profile.dev.package."*"]
opt-level = 1
debug = 1
