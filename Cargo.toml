[package]
name = "khogame"
version = "0.7.0"
edition = "2021"
rust-version = "1.98"
authors = ["Kho Game Team"]
description = "Kho Game - Trang chia sẻ game độc lập"
license = "MIT"

[[bin]]
name = "khogame"
path = "src/main.rs"

[dependencies]
# Web framework
axum = { version = "0.8.9", features = ["macros", "form"] }
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "cors", "trace", "compression-gzip", "set-header", "request-id"] }

# Templating
askama = "0.16.0"

# Database
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls-ring", "postgres", "uuid", "chrono", "json", "macros", "migrate", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
time = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"

# Authentication (Google OAuth 2.0 qua reqwest)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rand = "0.8"
base64 = "0.23"
sha2 = "0.10"
hex = "0.4"
url = "2.5"

# Utils
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
slug = "0.1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
