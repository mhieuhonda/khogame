# ============================================================
# Louis Space - Production Compose (chạy trên Coolify)
# Source of truth cho stack prod: app + PostgreSQL 17.
#
# __IMAGE_REF__ được GitHub Actions thay bằng image pin digest
# (ghcr.io/mhieuhonda/khogame@sha256:...) trước mỗi lần deploy
# → Coolify luôn pull đúng phiên bản vừa build.
#
# Lưu ý: tên service / DB user / volume giữ 'khogame' để tương thích
# lùi với dữ liệu prod hiện có (đổi tên sẽ mất volume + dữ liệu user).
# Brand hiển thị với end-user nằm trong app (logo, layout, manifest).
#
# Secrets (DB_PASSWORD, SESSION_KEY, GOOGLE_CLIENT_ID/SECRET)
# KHÔNG nằm trong repo — khai báo trong tab Environment Variables
# của Service trên Coolify, compose tự nội suy ${VAR}.
# ============================================================

services:
  khogame:
    image: __IMAGE_REF__
    restart: unless-stopped
    # Graceful shutdown: app đã bắt SIGTERM và chờ request hoàn tất;
    # cho Docker 30s grace period trước khi SIGKILL (mặc định chỉ 10s,
    # đủ làm đứt các request download/comment đang xử lý lúc deploy).
    # Phải khớp `GRACEFUL_SHUTDOWN_TIMEOUT_SECS` (mặc định 30s) trong env
    # app để force-exit timer không kích hoạt quá sớm.
    stop_grace_period: 30s
    environment:
      - DATABASE_URL=postgres://khogame:${DB_PASSWORD}@khogame-db:5432/khogame
      - SESSION_KEY=${SESSION_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://louis.vangioitutien.com/auth/google/callback
      - BASE_URL=https://louis.vangioitutien.com
      - ADMIN_EMAIL=khongdich.admin@gmail.com
      - RUST_LOG=khogame=info,tower_http=warn
      - TZ=Asia/Ho_Chi_Minh
      # v2.8.0 — Token gọi GitHub API khi đăng/làm mới repo. KHÔNG có token
      # → quota 60 req/giờ theo IP datacenter, dễ cạn vì chia sẻ NAT với
      # app khác → đăng repo báo 403/429 liên tục. Giá trị thật khai báo
      # trong tab Environment Variables của Service trên Coolify (không
      # commit secret vào repo). PAT fine-grained không cần scope cho repo public.
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      # v1.3.0 PERF: giữ 2 connection DB luôn ấm — traffic thấp sau giờ
      # tốn idle_timeout (300s) đóng hết connection, request đầu tiên của
      # user buổi sáng phải trả thêm ~5-20ms setup TCP+auth Postgres.
      - DB_MIN_CONNECTIONS=2
    depends_on:
      khogame-db:
        condition: service_healthy
    networks:
      - default
      - coolify
    volumes:
      - khogame-storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # ─── NOTE: Security hardening đã bị REMOVE (tạm thời) ──────────────
    # Trước đây có read_only + tmpfs + cap_drop ALL + security_opt +
    # pids_limit + mem_limit + cpus, nhưng KHÔNG bao giờ được test thực
    # tế trên prod (Coolify API token hết hạn → PATCH luôn fail → compose
    # cũ không có hardening vẫn chạy). Lần đầu token work, hardening DB
    # (cap_drop ALL) break postgres → crash-loop → web 503.
    # Quyết định: remove hardening BOTH app + DB để compose match chính xác
    # phiên bản đang chạy healthy trên prod. Giảm risk phá prod lần nữa.
    # TODO: re-add hardening từng bước, test trên staging trước:
    #   1) logging rotation (đã giữ — safe)
    #   2) app: read_only + tmpfs + cap_drop ALL (app non-root, port >1024)
    #   3) DB: chỉ CAP_CHOWN+DAC_OVERRIDE (giữ entrypoint chown), không ALL
    #   4) Resource limits (mem_limit/cpus) — kiểm tra tải thực tế trước
    # ─── Log rotation (json-file driver default không xoay → disk đầy) ───
    # Coolify host thường có disk 20-50GB; app log ~1MB/phút nếu traffic
    # cao → đầy disk trong ~1 tuần nếu không rotate.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - traefik.enable=true
      - traefik.http.routers.kgx-https.rule=Host(`louis.vangioitutien.com`)
      - traefik.http.routers.kgx-https.entrypoints=https
      - traefik.http.routers.kgx-https.tls=true
      - traefik.http.routers.kgx-https.tls.certresolver=letsencrypt
      - traefik.http.routers.kgx-https.service=kgx-svc
      - traefik.http.routers.kgx-http.rule=Host(`louis.vangioitutien.com`)
      - traefik.http.routers.kgx-http.entrypoints=http
      - traefik.http.routers.kgx-http.service=kgx-svc
      # Force HTTPS — Secure cookie sẽ bị browser từ chối nếu user vào bằng http
      - traefik.http.routers.kgx-http.middlewares=kgx-rdr@docker
      - 'traefik.http.routers.kgx-wild-http.rule=HostRegexp(`[a-z0-9-]+\.louis\.vangioitutien\.com`)'
      - traefik.http.routers.kgx-wild-http.entrypoints=http
      - traefik.http.routers.kgx-wild-http.service=kgx-svc
      - traefik.http.routers.kgx-wild-http.priority=1
      - traefik.http.routers.kgx-wild-http.middlewares=kgx-rdr@docker
      - traefik.http.middlewares.kgx-rdr.redirectscheme.scheme=https
      - traefik.http.middlewares.kgx-rdr.redirectscheme.permanent=true
      - 'traefik.http.routers.kgx-wild-https.rule=HostRegexp(`[a-z0-9-]+\.louis\.vangioitutien\.com`)'
      - traefik.http.routers.kgx-wild-https.entrypoints=https
      - traefik.http.routers.kgx-wild-https.tls=true
      - traefik.http.routers.kgx-wild-https.service=kgx-svc
      - traefik.http.routers.kgx-wild-https.priority=1
      - traefik.http.services.kgx-svc.loadbalancer.server.port=3000

  khogame-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=khogame
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=khogame
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - khogame-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khogame -d khogame"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    # ─── NOTE: Security hardening đã bị REMOVE khỏi DB container ───
    # Trước đây có cap_drop: ALL + security_opt + pids_limit + mem_limit +
    # cpus, nhưng cap_drop: ALL khiến postgres:17-alpine entrypoint không
    # chown được PGDATA (cần CAP_CHOWN) → container crash-loop → toàn bộ
    # stack unhealthy → web 503. Fix: bỏ hardening DB, giữ logging rotation.
    # App hardening (read_only + cap_drop ALL) vẫn giữ vì app chạy non-root,
    # bind port 3000 >1024, không cần capability nào.
    # TODO: re-add DB hardening cẩn thận sau (CAP_CHOWN + DAC_OVERRIDE), test
    # trên staging trước khi đưa prod.
    # ─── Log rotation (json-file driver default không xoay → disk đầy) ───
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  khogame-storage:
  khogame-pgdata:

networks:
  coolify:
    external: true
