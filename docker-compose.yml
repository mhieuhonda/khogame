# ============================================================
# Louis Space - Local dev compose (app + PostgreSQL 17)
# Dùng cho `docker compose up -d --build` từ repo root.
# Production compose: deploy/compose.prod.yml.
#
# Khác biệt chính với prod:
#  - Build từ source (build: .) thay vì pull image pin-digest.
#  - Google OAuth credentials lấy từ .env (operator tự điền).
#  - Storage là named volume (persistent local giữa các lần up).
#  - Không có Traefik labels (dev dùng http://localhost:3000 trực tiếp).
#  - Không có mem/caps hardening (dev cần debug dễ hơn).
# ============================================================

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: khogame
      POSTGRES_PASSWORD: khogame_local_dev
      POSTGRES_DB: khogame
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # v3.5.1 FIX (audit 5-c): bind 127.0.0.1 thay vì 0.0.0.0 — file compose
      # dev có password hardcode công khai trong repo; nếu chạy trên VPS/public
      # host, 0.0.0.0 expose Postgres ra internet với credential ai cũng đọc
      # được. Chỉ app trong cùng compose network cần kết nối được tới DB —
      # loopback binding vẫn cho phép psql từ host để debug.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khogame -d khogame"]
      interval: 5s
      timeout: 3s
      retries: 10
      # start_period 30s: postgres container có thể mất 5-15s để init
      # data dir lần đầu (initdb) — không có start_period, compose có
      # thể báo unhealthy trước khi postgres sẵn sàng.
      start_period: 30s

  app:
    image: khogame:local
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      BASE_URL: http://localhost:3000
      DATABASE_URL: postgres://khogame:khogame_local_dev@postgres:5432/khogame
      # SESSION_KEY default 64 hex zeros — CHỈ dùng cho dev, prod phải set
      # key thật (`openssl rand -hex 32`). Bất kỳ >= 32 byte nào cũng pass
      # check độ dài trong config.rs; default này hợp lệ để local dev chạy
      # không cần copy .env.example.
      SESSION_KEY: ${SESSION_KEY:-change_me_64_hex_chars_in_production_0000000000000}
      # Google OAuth credentials bắt buộc — config.rs fail-fast nếu thiếu.
      # Lấy từ .env (operator tự điền sau khi `cp .env.example .env`).
      # `${VAR:?error}` syntax: nếu thiếu, compose fail với message rõ ràng
      # thay vì im lặng pass empty string (để config.rs báo lỗi mơ hồ).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID missing — cp .env.example .env và điền OAuth credentials}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET missing — cp .env.example .env và điền OAuth credentials}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/auth/google/callback}
      # v3.5.1 FIX (audit 5-c): bỏ default cứng email admin trong repo công
      # khai — cấu hình của ai tự động lên admin khi login Google là thông
      # tin nhạy cảm (biết được = nhắm đúng tài khoản chiếm quyền). Dev
      # muốn auto-admin thì tự set ADMIN_EMAIL trong .env.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      RUST_LOG: ${RUST_LOG:-khogame=debug,tower_http=info}
      TZ: Asia/Ho_Chi_Minh
      # v2.9.1 — GitHub token (optional): tăng quota GitHub API 60 → 5000
      # req/giờ cho đăng repo + job nền refresh số sao. Lấy từ .env.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # v2.9.1 — Email notification (SMTP, optional): để trống SMTP_HOST →
      # email tắt im lặng (dev thường không cần). Xem .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    ports:
      - "3000:3000"
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  storage:
