{# Download buttons - links are hidden, only show platform buttons #}
<div class="download-buttons" id="download-buttons-{{ slug }}">
    {% if links.is_empty() %}
    <div class="no-downloads">
        <p>⚠️ Chưa có link tải cho game này.</p>
    </div>
    {% else %}
    <div class="download-grid">
        {% for link in links %}
        <form class="download-form"
              hx-post="/games/{{ slug }}/download"
              hx-vals='{"platform": "{{ link.platform.label()|lower }}"}'
              hx-target="#download-buttons-{{ slug }}"
              hx-swap="none"
              hx-on::after-request="if(event.detail.successful && event.detail.xhr.getResponseHeader('X-Redirect')) window.location = event.detail.xhr.getResponseHeader('X-Redirect')">
            <button type="submit" class="btn btn-download platform-{{ link.platform.label()|lower }}">
                <span class="platform-icon">
                    {% if link.platform.label() == "Android" %}🤖{% else if link.platform.label() == "iOS" %}🍎{% else if link.platform.label() == "Windows" %}🪟{% else if link.platform.label() == "Linux" %}🐧{% else if link.platform.label() == "macOS" %}💻{% endif %}
                </span>
                <div class="platform-text">
                    <span class="platform-label">Tải về cho</span>
                    <span class="platform-name">{{ link.platform.label() }}</span>
                </div>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
            </button>
        </form>
        {% endfor %}
    </div>
    {% if !is_authenticated %}
    <p class="download-note">⚠️ Bạn cần <a href="/login">đăng nhập</a> để tải game và lưu lịch sử tải về.</p>
    {% endif %}
    {% endif %}
</div>
