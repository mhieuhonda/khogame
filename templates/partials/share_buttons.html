{# Share buttons - dùng data-* để tránh XSS từ title (đã có case title chứa quote) #}
<div class="share-buttons"
     data-slug="{{ slug }}"
     data-title="{{ title }}"
     data-share-url="{{ share_url }}">
    <a href="https://www.facebook.com/sharer/sharer.php?u={{ share_url }}"
       target="_blank" rel="noopener" class="share-btn share-facebook"
       data-share-platform="facebook">f</a>
    <a href="https://twitter.com/intent/tweet?url={{ share_url }}"
       target="_blank" rel="noopener" class="share-btn share-twitter"
       data-share-platform="twitter">𝕏</a>
    <a href="https://t.me/share/url?url={{ share_url }}"
       target="_blank" rel="noopener" class="share-btn share-telegram"
       data-share-platform="telegram">✈</a>
    <a href="https://wa.me/?text={{ share_url }}"
       target="_blank" rel="noopener" class="share-btn share-whatsapp"
       data-share-platform="whatsapp">W</a>
    <button type="button" class="share-btn share-copy" data-share-platform="copy" title="Sao chép link">📋</button>
    <button type="button" class="share-btn share-native" data-share-platform="native" title="Chia sẻ qua ứng dụng">📤</button>
</div>
