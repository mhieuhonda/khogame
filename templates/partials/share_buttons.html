{# Share buttons #}
<div class="share-buttons">
    <a href="https://www.facebook.com/sharer/sharer.php?u=/games/{{ slug }}"
       target="_blank" rel="noopener" class="share-btn share-facebook"
       onclick="recordShare('{{ slug }}', 'facebook')">f</a>
    <a href="https://twitter.com/intent/tweet?url=/games/{{ slug }}"
       target="_blank" rel="noopener" class="share-btn share-twitter"
       onclick="recordShare('{{ slug }}', 'twitter')">𝕏</a>
    <a href="https://t.me/share/url?url=/games/{{ slug }}"
       target="_blank" rel="noopener" class="share-btn share-telegram"
       onclick="recordShare('{{ slug }}', 'telegram')">✈</a>
    <a href="https://wa.me/?text=/games/{{ slug }}"
       target="_blank" rel="noopener" class="share-btn share-whatsapp"
       onclick="recordShare('{{ slug }}', 'whatsapp')">W</a>
    <button class="share-btn share-copy" onclick="copyShareLink('{{ slug }}')" title="Sao chép link">📋</button>
    <button class="share-btn share-native" onclick="nativeShare('{{ slug }}', '{{ title|esc }}')" title="Chia sẻ qua ứng dụng">📤</button>
</div>
