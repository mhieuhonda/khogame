{# Like button - htmx swap target #}
<button class="action-btn like-btn {% if is_liked %}active{% endif %}"
        hx-post="/games/{{ slug }}/like"
        hx-target="this"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        aria-pressed="{% if is_liked %}true{% else %}false{% endif %}"
        aria-label="Thích game — {{ like_count }} lượt thích">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="{% if is_liked %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
    </svg>
    <span>{{ like_count|fmt_num }}</span>
</button>
