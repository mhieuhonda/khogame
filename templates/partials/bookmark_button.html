{# Bookmark button - htmx swap target #}
<button class="action-btn bookmark-btn {% if is_bookmarked %}active{% endif %}"
        hx-post="/games/{{ slug }}/bookmark"
        hx-target="this"
        hx-swap="outerHTML"
        hx-disabled-elt="this"
        aria-pressed="{% if is_bookmarked %}true{% else %}false{% endif %}"
        aria-label="{% if is_bookmarked %}Bỏ lưu game{% else %}Lưu game vào bookmark{% endif %}"
        title="{% if is_bookmarked %}Bỏ lưu{% else %}Lưu game{% endif %}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="{% if is_bookmarked %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
    </svg>
    <span>{% if is_bookmarked %}Đã lưu{% else %}Lưu{% endif %}</span>
</button>
