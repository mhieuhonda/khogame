{# Rating stars - interactive via htmx #}
<div class="rating-stars" id="rating-stars-{{ slug }}">
    <div class="stars-input" role="group" aria-label="Chọn số sao đánh giá game">
        {% for i in 1..=5 %}
        {# aria-pressed là thuộc tính toggle chuẩn cho <button>; aria-checked
           chỉ hợp lệ trên role checkbox/radio/option — button thường kèm
           aria-checked là ARIA không hợp lệ, screen reader bỏ qua. #}
        <button class="star {% if user_rating.unwrap_or(0) >= i %}filled{% endif %} {% if user_rating.is_some() %}user-rated{% endif %}"
                hx-post="/games/{{ slug }}/rate"
                hx-vals='{"score": {{ i }} }'
                hx-target="#rating-stars-{{ slug }}"
                hx-swap="outerHTML"
                hx-disabled-elt="this"
                title="{{ i }} sao"
                aria-label="Đánh giá {{ i }} trên 5 sao"
                {% if user_rating.unwrap_or(0) >= i %}aria-pressed="true"{% else %}aria-pressed="false"{% endif %}>
            <span aria-hidden="true">★</span>
        </button>
        {% endfor %}
    </div>
    <div class="rating-info">
        <span class="rating-avg">{{ rating_avg|fmt("{:.1}") }}</span>
        <span class="rating-count">({{ rating_count }} đánh giá)</span>
    </div>
</div>
